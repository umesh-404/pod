[package]
name = "pod"
description = "Pod for Windows and Linux — a temporary workspace at the top of your screen"
# The .deb's Maintainer field. Pod is a fork of Coucou by Louis Raillé (see LICENSE).
authors = ["umesh-404"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# SHA-256 of downloaded updates and of ffmpeg (update.rs, convert.rs); already in the tree through rustls.
ring = "0.17"
# The PDF tools (pdf.rs) work on PDFs locally; Windows has no PDF library of its own. MIT, pure
# Rust, default features (clock, rayon) off.
lopdf = { version = "0.46", default-features = false }
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
drag = "2"
trash = "5"
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }
notify = { version = "8", default-features = false }
icalendar = "0.17"
rrule = "0.14"
chrono = "0.4"
# Calendar TZIDs (calendar.rs); already in the tree through rrule, same features.
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
windows = { version = "0.61", features = [
  # The media widget: the system media controls (media.rs).
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  # The shelf's thumbnails: the shell's HBITMAP read back with GetDIBits (shelf.rs).
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  # The notch's system glance: battery level and charging (sysglance.rs).
  "Win32_System_Power",
  # Listening TCP ports for the dev servers (devservers.rs).
  "Win32_NetworkManagement_IpHelper",
  # The clipboard's change counter, to spot a new screenshot (capture.rs).
  "Win32_System_DataExchange",
  # The shelf's PDF thumbnails: the first page drawn by Windows' own PDF engine (shelf.rs).
  "Data_Pdf",
  "Storage",
  # Text from image: Windows' own OCR on a decoded bitmap (ocr.rs).
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Foundation_Collections",
  # Batch rename that never replaces a file: MoveFileExW without REPLACE_EXISTING (rename.rs).
  "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# libdbus: Wayland global shortcuts through the XDG GlobalShortcuts portal (portal.rs).
dbus = "0.9.12"
